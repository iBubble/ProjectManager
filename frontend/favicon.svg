<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Roof / Pediment -->
  <polygon points="64,16 12,46 116,46" fill="#D4C29D" stroke="#8C734B" stroke-width="3" stroke-linejoin="round"/>
  <!-- Inner Triangular Shadow -->
  <polygon points="64,24 24,44 104,44" fill="#B39F7A"/>
  <!-- Architrave Beam -->
  <rect x="14" y="46" width="100" height="10" fill="#C2AB80" stroke="#8C734B" stroke-width="2" rx="1"/>
  <rect x="18" y="48" width="92" height="6" fill="#E8DED0"/>
  
  <!-- Column Capitals -->
  <rect x="22" y="56" width="16" height="4" fill="#B39F7A"/>
  <rect x="46" y="56" width="16" height="4" fill="#B39F7A"/>
  <rect x="70" y="56" width="16" height="4" fill="#B39F7A"/>
  <rect x="94" y="56" width="16" height="4" fill="#B39F7A"/>

  <!-- Background between columns -->
  <rect x="20" y="60" width="88" height="40" fill="#2E2419"/>

  <!-- 4 Columns -->
  <rect x="23" y="60" width="14" height="40" fill="#EDE4D8" stroke="#A89470" stroke-width="1.5" rx="1"/>
  <rect x="47" y="60" width="14" height="40" fill="#EDE4D8" stroke="#A89470" stroke-width="1.5" rx="1"/>
  <rect x="71" y="60" width="14" height="40" fill="#EDE4D8" stroke="#A89470" stroke-width="1.5" rx="1"/>
  <rect x="95" y="60" width="14" height="40" fill="#EDE4D8" stroke="#A89470" stroke-width="1.5" rx="1"/>

  <!-- Column Shading/Highlights -->
  <rect x="25" y="60" width="4" height="40" fill="#FFFFFF" opacity="0.6"/>
  <rect x="49" y="60" width="4" height="40" fill="#FFFFFF" opacity="0.6"/>
  <rect x="73" y="60" width="4" height="40" fill="#FFFFFF" opacity="0.6"/>
  <rect x="97" y="60" width="4" height="40" fill="#FFFFFF" opacity="0.6"/>

  <!-- Base Steps -->
  <rect x="18" y="100" width="92" height="7" fill="#C2AB80" stroke="#8C734B" stroke-width="1.5" rx="1"/>
  <rect x="14" y="107" width="100" height="7" fill="#B39F7A" stroke="#8C734B" stroke-width="1.5" rx="1"/>
  <rect x="10" y="114" width="108" height="8" fill="#9E8760" stroke="#7A623B" stroke-width="1.5" rx="1"/>
</svg>